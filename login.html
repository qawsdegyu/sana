<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <title>تسجيل الدخول | سَنَع</title>
    <style>body { background-color: #060913; margin: 0; }</style>
    <script src="components/head.js?v=3"></script>
    <link rel="stylesheet" href="login.css?v=1">

  <style>
    /* Page Transition Overlay */
    #page-transition-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #060913; /* Dark theme color matching sana */
      z-index: 999999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out;
      opacity: 1;
      visibility: visible;
    }
    #page-transition-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .page-transition-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(0, 242, 254, 0.1);
      border-top: 3px solid #00f2fe; /* Cyan glow color */
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
    }
    .page-transition-text {
      color: #00f2fe;
      margin-top: 20px;
      font-family: inherit;
      font-weight: bold;
      letter-spacing: 1px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; text-shadow: 0 0 10px rgba(0,242,254,0.5); }
    }
    body.transitioning {
      overflow: hidden;
    }
  </style>
</head>
<body>

  <div id="page-transition-overlay">
    <div class="page-transition-spinner"></div>
    <div class="page-transition-text">سَنَع...</div>
  </div>

    <!-- Shared Navbar (injected by components/navbar.js) -->
    <div id="navbar-container"></div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-tabs">
                <div class="auth-tab active" id="tabLogin" onclick="switchTab('login')" data-i18n="تسجيل الدخول">تسجيل الدخول</div>
                <div class="auth-tab" id="tabSignup" onclick="switchTab('signup')" data-i18n="إنشاء حساب">إنشاء حساب</div>
            </div>

            <div id="errorMsg" class="error-message"></div>
            <div id="successMsg" class="success-message"></div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label data-i18n="البريد الإلكتروني">البريد الإلكتروني</label>
                    <input type="email" id="loginEmail" required>
                </div>
                <div class="form-group">
                    <label data-i18n="كلمة المرور">كلمة المرور</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <div style="text-align: left; margin-bottom: 1rem;">
                    <a href="#" onclick="handleForgotPassword()" style="color: var(--text-light); font-size: 0.9rem;" data-i18n="نسيت كلمة المرور؟">نسيت كلمة المرور؟</a>
                </div>
                <button type="submit" class="btn-submit" id="btnLoginSubmit">
                    <span data-i18n="دخول">دخول</span>
                </button>
            </form>

            <!-- Signup Form -->
            <form id="signupForm" style="display: none;" onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label data-i18n="الاسم الرباعي">الاسم الرباعي</label>
                    <input type="text" id="signupName" required>
                </div>
                <div class="form-group">
                    <label data-i18n="البريد الإلكتروني">البريد الإلكتروني</label>
                    <input type="email" id="signupEmail" required>
                </div>
                <div class="form-group">
                    <label data-i18n="كلمة المرور">كلمة المرور</label>
                    <input type="password" id="signupPassword" required>
                    <small style="color: var(--text-light); display: block; margin-top: 5px;" data-i18n="يجب أن تحتوي كلمة المرور على 8 خانات، تشمل حروفاً كبيرة وصغيرة وأرقاماً ورموزاً.">يجب أن تحتوي كلمة المرور على 8 خانات، تشمل حروفاً كبيرة وصغيرة وأرقاماً ورموزاً.</small>
                </div>
                <div class="form-group">
                    <label data-i18n="تأكيد كلمة المرور">تأكيد كلمة المرور</label>
                    <input type="password" id="signupConfirmPassword" required>
                </div>
                
                <button type="submit" class="btn-submit" id="btnSignupSubmit">
                    <span data-i18n="إنشاء الحساب">إنشاء الحساب</span>
                </button>
            </form>

            <div style="text-align: center; margin: 1.5rem 0; color: var(--text-light);" data-i18n="أو">أو</div>
            
            <button class="btn-google" onclick="handleGoogleLogin()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                <span data-i18n="المتابعة باستخدام جوجل">المتابعة باستخدام جوجل</span>
            </button>
        </div>
    </div>
    <!-- Shared Footer (injected by components/footer.js) -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js?v=2"></script>
    <script src="components/navbar.js?v=3"></script>
    <script src="components/footer.js?v=3"></script>
    <script src="auth-state.js?v=2"></script>
    <script src="app.js?v=1"></script>
    <script src="translations.js?v=2"></script>
    <script src="lang.js?v=2"></script>
    <script src="script.js?v=2"></script>
    <script src="login.js?v=2"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const overlay = document.getElementById('page-transition-overlay');
      
      const hideOverlay = () => {
        if (overlay) {
          overlay.classList.add('hidden');
          document.body.classList.remove('transitioning');
        }
      };

      document.body.classList.add('transitioning');
      window.addEventListener('load', hideOverlay);
      setTimeout(hideOverlay, 2000);

      window.addEventListener('pageshow', (event) => {
        if (event.persisted) hideOverlay();
      });

      document.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', function(e) {
          if (this.target === '_blank') return;
          const href = this.getAttribute('href');
          if (!href || href.startsWith('#') || href.startsWith('javascript:') || href.startsWith('mailto:') || href.startsWith('tel:')) return;
          if (this.hostname !== window.location.hostname && this.hostname !== '') return;
          if (this.classList.contains('no-transition')) return;
          if (e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;

          e.preventDefault();
          if (overlay) {
            document.body.classList.add('transitioning');
            overlay.classList.remove('hidden');
          }
          setTimeout(() => { window.location.href = this.href; }, 150);
        });
      });
    });
  </script>
</body>
</html>
