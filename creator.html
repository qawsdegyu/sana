<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <title>مختبر الإبداع الذكي | سَنَع</title>
    <!-- Marked.js for markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>body { background-color: #060913; margin: 0; }</style>
    <script src="components/head.js?v=3"></script>
    <link rel="stylesheet" href="creator.css?v=1">

  <style>
    /* Page Transition Overlay */
    #page-transition-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #060913; /* Dark theme color matching sana */
      z-index: 999999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out;
      opacity: 1;
      visibility: visible;
    }
    #page-transition-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .page-transition-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(0, 242, 254, 0.1);
      border-top: 3px solid #00f2fe; /* Cyan glow color */
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
    }
    .page-transition-text {
      color: #00f2fe;
      margin-top: 20px;
      font-family: inherit;
      font-weight: bold;
      letter-spacing: 1px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; text-shadow: 0 0 10px rgba(0,242,254,0.5); }
    }
    body.transitioning {
      overflow: hidden;
    }
  </style>
</head>
<body>

  <div id="page-transition-overlay">
    <div class="page-transition-spinner"></div>
    <div class="page-transition-text">سَنَع...</div>
  </div>

    <!-- Shared Navbar (injected by components/navbar.js) -->
    <div id="navbar-container"></div>

    <div class="creator-page">
        <!-- Sidebar -->
        <div class="sidebar" id="historySidebar">
            <button id="newChatBtn" class="btn-new-chat">+ محادثة جديدة</button>
            <div class="history-list" id="historyList">
                <!-- المحادثات السابقة ستظهر هنا -->
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="chat-container">
                <div id="chatMessages" class="chat-messages">
                    <div id="welcomeScreen" class="welcome-screen">
                        <h1 style="color: var(--primary-color); font-size: 2.2rem; margin-bottom: 10px;">كيف يمكنني مساعدتك اليوم؟</h1>
                        <p style="color: var(--text-light); font-size: 1.2rem;">أنا المبتكر الذكي، يمكنني اختراع أنظمة وعوالم جديدة كلياً، ومناقشتها معك، وتصميم امتحانات لتقييم فهمك.</p>
                        
                        <div class="domains-grid">
                            <div class="domain-card" data-prompt="ابتكر لي جهاز ميكانيكي جديد كلياً"><div class="domain-icon">⚙️</div><h4>جهاز ميكانيكي</h4></div>
                            <div class="domain-card" data-prompt="ابتكر لي لغة تواصل جديدة لا تعتمد على الصوت"><div class="domain-icon">🗣️</div><h4>لغة تواصل مبتكرة</h4></div>
                            <div class="domain-card" data-prompt="ابتكر لي نظام أرقام ورياضيات جديد"><div class="domain-icon">🔢</div><h4>نظام أرقام جديد</h4></div>
                            <div class="domain-card" data-prompt="ابتكر لي نظام اقتصادي مختلف تماماً"><div class="domain-icon">💹</div><h4>نظام اقتصادي</h4></div>
                        </div>
                    </div>
                </div>
                
                <div class="input-area-container">
                    <div class="input-wrapper">
                        <div id="quickActions" class="quick-actions" style="display: none;">
                            <button class="btn-quick" data-action="quiz">📝 اختبرني (امتحان ضع دائرة)</button>
                            <button class="btn-quick" data-action="image">🖼️ توليد صورة أخرى للنظام</button>
                            <button class="btn-quick" data-action="explain">🤔 اشرح لي المزيد بتفصيل أبسط</button>
                        </div>
                        <div style="position: relative;">
                            <textarea id="chatInput" class="chat-input" placeholder="اكتب فكرتك أو اسألني أي سؤال..."></textarea>
                            <button id="chatSendBtn" class="btn-send">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js?v=2"></script>
    <script src="components/navbar.js?v=3"></script>
    <script src="auth-state.js?v=2"></script>
    <script src="app.js?v=1"></script>
    <script src="translations.js?v=2"></script>
    <script src="lang.js?v=2"></script>
    <script src="script.js?v=2"></script>

    <!-- API KEY INJECTED HERE SO IT DOESN'T NEED TO BE IN JS --><input type="hidden" id="apiKey" value="YOUR_OPENROUTER_API_KEY_HERE">
    <script src="creator.js?v=4"></script>
    
    <!-- Mobile Sidebar Toggle Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mobileSidebarBtn = document.getElementById('mobileSidebarBtn');
            const historySidebar = document.getElementById('historySidebar');
            
            if (mobileSidebarBtn) {
                mobileSidebarBtn.addEventListener('click', () => {
                    historySidebar.classList.toggle('show');
                });
            }
            
            // Hide sidebar when a history item is clicked on mobile
            document.getElementById('historyList').addEventListener('click', (e) => {
                if (e.target.tagName === 'BUTTON' && window.innerWidth <= 768) {
                    historySidebar.classList.remove('show');
                }
            });
            
            // Hide sidebar when New Chat is clicked on mobile
            const newChatBtn = document.getElementById('newChatBtn');
            if (newChatBtn) {
                newChatBtn.addEventListener('click', () => {
                    if (window.innerWidth <= 768) historySidebar.classList.remove('show');
                });
            }
        });
    </script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const overlay = document.getElementById('page-transition-overlay');
      
      const hideOverlay = () => {
        if (overlay) {
          overlay.classList.add('hidden');
          document.body.classList.remove('transitioning');
        }
      };

      document.body.classList.add('transitioning');
      window.addEventListener('load', hideOverlay);
      setTimeout(hideOverlay, 2000);

      window.addEventListener('pageshow', (event) => {
        if (event.persisted) hideOverlay();
      });

      document.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', function(e) {
          if (this.target === '_blank') return;
          const href = this.getAttribute('href');
          if (!href || href.startsWith('#') || href.startsWith('javascript:') || href.startsWith('mailto:') || href.startsWith('tel:')) return;
          if (this.hostname !== window.location.hostname && this.hostname !== '') return;
          if (this.classList.contains('no-transition')) return;
          if (e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;

          e.preventDefault();
          if (overlay) {
            document.body.classList.add('transitioning');
            overlay.classList.remove('hidden');
          }
          setTimeout(() => { window.location.href = this.href; }, 150);
        });
      });
    });
  </script>
</body>
</html>
