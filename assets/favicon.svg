<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#1e293b" />
        </linearGradient>
        <linearGradient id="grad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00f2fe" />
            <stop offset="100%" stop-color="#4facfe" />
        </linearGradient>
    </defs>
    <!-- Background with rounded corners -->
    <rect width="512" height="512" rx="100" fill="url(#bg)" />
    
    <!-- Spark symbolizing 'Sana' (Brilliance/Light) -->
    <path d="M256 80 L285 190 L400 215 L285 240 L256 350 L227 240 L112 215 L227 190 Z" fill="url(#grad)"/>
    
    <!-- Smaller spark symbolizing creativity -->
    <path d="M350 280 L365 330 L420 345 L365 360 L350 410 L335 360 L280 345 L335 330 Z" fill="#fe7f2d"/>
    
    <!-- Central eye/dot -->
    <circle cx="256" cy="215" r="25" fill="#0f172a"/>
</svg>
